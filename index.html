<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JS Music Player POC</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main class="app">
      <header class="app__header">
        <div>
          <p class="eyebrow">POC</p>
          <h1>MusicXML Audio Playback</h1>
          <p class="subtitle">Salamander piano samples · per-part volume/pan/mute · tempo control</p>
        </div>
        <div class="header__right">
          <label class="file-input">
            <input type="file" id="fileInput" accept=".musicxml,.xml" />
            <span class="btn">Open MusicXML...</span>
          </label>
          <div class="status" id="status">Open a MusicXML file to begin</div>
        </div>
      </header>

      <div class="app__body">
        <aside class="sidebar">
          <section class="panel">
            <div class="controls">
              <button id="playButton" class="btn btn--primary" disabled>Play</button>
              <button id="stopButton" class="btn" disabled>Stop</button>
            </div>
            <div class="tempo">
              <label for="tempo">Tempo (BPM)</label>
              <input id="tempo" type="range" min="40" max="200" value="120" />
              <span id="tempoValue">120</span>
            </div>
            <div class="tempo-presets" id="tempoPresets">
              <button class="btn btn--small" data-tempo-pct="50">50%</button>
              <button class="btn btn--small" data-tempo-pct="75">75%</button>
              <button class="btn btn--small btn--active" data-tempo-pct="100">100%</button>
              <button class="btn btn--small" data-tempo-pct="125">125%</button>
              <button class="btn btn--small" data-tempo-pct="150">150%</button>
            </div>
          </section>

          <section class="panel">
            <div class="panel__header">
              <h2>Voices</h2>
            </div>
            <p class="hint">Pan your voice left, others right.</p>
            <div id="parts" class="parts"></div>
          </section>
        </aside>

        <section class="panel panel--timeline">
          <div class="panel__header">
            <h2>Timeline</h2>
            <div class="timeline__actions">
              <button id="downloadJson" class="btn">JSON</button>
              <button id="downloadCsv" class="btn">CSV</button>
            </div>
          </div>
          <div id="timeline" class="timeline"></div>
        </section>
      </div>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
