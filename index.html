<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JS Music Player POC</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main class="app">
      <header class="app__header">
        <div>
          <p class="eyebrow">POC</p>
          <h1>MusicXML Audio Playback</h1>
          <p class="subtitle">Salamander piano samples · per-part volume/pan/mute · tempo control</p>
        </div>
        <div class="header__right">
          <div class="score-controls">
            <label class="my-voice" title="Select the voice part you're singing">
              <span>My voice:</span>
              <select id="userVoice">
                <option value="S1">Soprano 1</option>
                <option value="S2">Soprano 2</option>
                <option value="A1">Alto 1</option>
                <option value="A2">Alto 2</option>
                <option value="T1">Tenor 1</option>
                <option value="T2">Tenor 2</option>
                <option value="B1">Bass 1</option>
                <option value="B2">Bass 2</option>
                <option value="B3">Bass 3</option>
              </select>
            </label>
            <label class="pan-invert" title="Swap your voice to left ear, others to right">
              <input type="checkbox" id="panInvert" />
              <span>Flip L/R</span>
            </label>
            <select id="scoreSelect" class="score-select">
              <option value="">Select a score...</option>
            </select>
            <span class="or">or</span>
            <label class="file-input">
              <input type="file" id="fileInput" accept=".musicxml,.xml" />
              <span class="btn">Open file...</span>
            </label>
          </div>
          <div class="status" id="status">Select a score to begin</div>
        </div>
      </header>

      <div class="app__body">
        <aside class="sidebar">
          <section class="panel">
             <div class="controls">
             </div>
            <div class="tempo-group">
              <div class="tempo">
                <label for="tempo">Tempo (BPM)</label>
                <input id="tempo" type="range" min="40" max="200" value="120" />
                <span id="tempoValue">120</span>
              </div>
              <div class="tempo-presets" id="tempoPresets">
                <button class="btn btn--small" data-tempo-pct="50" title="Half speed">0.5×</button>
                <button class="btn btn--small" data-tempo-pct="80" title="Slower">0.8×</button>
                <button class="btn btn--small" data-tempo-pct="90" title="Slightly slower">0.9×</button>
                <button class="btn btn--small btn--active" data-tempo-pct="100" title="Original tempo">1×</button>
                <button class="btn btn--small" data-tempo-pct="110" title="Slightly faster">1.1×</button>
                <button class="btn btn--small" data-tempo-pct="120" title="Faster">1.2×</button>
                <button class="btn btn--small" data-tempo-pct="150" title="Half again as fast">1.5×</button>
              </div>
            </div>
          </section>

          <section class="panel">
            <div class="panel__header">
              <h2>Voices</h2>
            </div>
            <p class="hint">Pan your voice left, others right.</p>
            <div id="parts" class="parts"></div>
          </section>
        </aside>

        <section class="panel panel--timeline">
          <div class="panel__header">
            <h2>Timeline</h2>
            <div class="timeline__actions">
              <button id="downloadJson" class="btn" title="Download timeline data as JSON">JSON</button>
              <button id="downloadCsv" class="btn" title="Download timeline data as CSV">CSV</button>
            </div>
          </div>
          <div id="timeline" class="timeline"></div>
        </section>
      </div>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
